plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.vishika'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.vishika"
        minSdk 24
        targetSdk 36
        versionCode 47
        versionName "4.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    
    // Lottie for animations
    implementation 'com.airbnb.android:lottie:6.4.0'
    
    // Firebase and Location Services
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-database'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.libraries.places:places:3.3.0'
    implementation 'com.github.yalantis:ucrop:2.2.8'
    
    // Emoji Panel
}

abstract class GenerateApkBundleTask extends DefaultTask {
    @Internal
    abstract DirectoryProperty getApkDir()

    @OutputFile
    abstract RegularFileProperty getOutputJs()

    @TaskAction
    void generate() {
        File dir = apkDir.get().asFile
        if (!dir.exists()) return
        File apkFile = new File(dir, "app-debug.apk")
        if (!apkFile.exists()) {
            File[] files = dir.listFiles({ d, name -> name.endsWith(".apk") } as FilenameFilter)
            if (files != null && files.length > 0) {
                apkFile = files.sort { -it.lastModified() }[0]
            }
        }
        if (apkFile != null && apkFile.exists()) {
            byte[] bytes = apkFile.bytes
            String b64 = java.util.Base64.getEncoder().encodeToString(bytes)
            File out = outputJs.get().asFile
            out.parentFile.mkdirs()
            out.setText(
                "window.__AUTO_APK_BUNDLE__ = {\n" +
                "  filename: \"" + apkFile.name + "\",\n" +
                "  sizeBytes: " + apkFile.length() + ",\n" +
                "  modifiedTime: " + apkFile.lastModified() + ",\n" +
                "  base64: \"" + b64 + "\"\n" +
                "};\n",
                "UTF-8"
            )
        }
    }
}

def generateApkBundle = tasks.register("generateApkBundleJs", GenerateApkBundleTask) {
    apkDir.set(layout.buildDirectory.dir("outputs/apk/debug"))
    outputJs.set(layout.buildDirectory.file("outputs/apk/debug/apk_bundle.js"))
    outputs.upToDateWhen { false }
}

tasks.matching { it.name == "assembleDebug" || it.name == "packageDebug" }.configureEach {
    finalizedBy(generateApkBundle)
}
